name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Origin of the Hono API server. The Pages site is static, so this is
      # baked into the bundle at build time. The VITE_API_ORIGIN Actions
      # variable (Settings > Secrets and variables > Actions > Variables)
      # overrides it.
      # TEMPORARY: falls back to the interim API host while the permanent one
      # is set up. Remove the fallback once the variable points there.
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://api-replicate-this.keeganvaz.in' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A malformed override would build a bundle that calls the wrong host
      # (or forrt.org/api itself, which 404s). Catch it before it ships.
      - name: Check API origin
        run: |
          echo "Building against API origin: $VITE_API_ORIGIN"
          case "$VITE_API_ORIGIN" in
            https://*) ;;
            *) echo "VITE_API_ORIGIN must start with https:// — got a value that does not." >&2; exit 1 ;;
          esac
          case "$VITE_API_ORIGIN" in
            */api|*/api/) echo "VITE_API_ORIGIN is the API origin only — drop the /api suffix, the app appends it." >&2; exit 1 ;;
          esac

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
