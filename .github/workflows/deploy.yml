name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # An empty value silently builds a bundle that calls the Pages origin
      # itself (forrt.org/api), which 404s. Catch it before it ships.
      - name: Check API origin
        run: |
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "VITE_API_ORIGIN is not set. Add it under Settings > Secrets and variables > Actions > Variables (not Secrets), e.g. https://api-replicate-this.keeganvaz.in" >&2
            exit 1
          fi
          case "$VITE_API_ORIGIN" in
            https://*) ;;
            *) echo "VITE_API_ORIGIN must start with https:// — got a value that does not." >&2; exit 1 ;;
          esac
          case "$VITE_API_ORIGIN" in
            */api|*/api/) echo "VITE_API_ORIGIN is the API origin only — drop the /api suffix, the app appends it." >&2; exit 1 ;;
          esac
        env:
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Build
        run: npm run build
        env:
          # Origin of the Hono API server; the Pages site is static, so this is
          # baked into the bundle at build time.
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
