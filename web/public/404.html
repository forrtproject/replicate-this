<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Replicate This</title>
    <script>
      // GitHub Pages has no SPA rewrite: it serves this file for any deep link.
      // Fold the route into a query string so index.html can restore it.
      var pathSegmentsToKeep = 1; // keep /replicate-this/
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
