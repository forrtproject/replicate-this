# Local development database. Production uses Postgres on the Münster server.
services:
  db:
    image: postgres:17-alpine
    container_name: replicate-this-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replicate_this
    ports:
      - '5432:5432'
    volumes:
      - replicate-this-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  replicate-this-db-data:
